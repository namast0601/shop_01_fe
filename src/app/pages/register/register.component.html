<div class="auth-page">
    <!-- Decorative Background Elements -->
    <div class="decor-background">
        <!-- Only Embers -->
        <div class="embers">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="auth-container fade-in-up">
        <div class="auth-header">
            <h1 class="serif-italic text-gold">Đăng Ký</h1>
            <p class="sub-text">Trở thành thành viên để nhận ưu đãi đặc quyền.</p>
        </div>

        <form class="auth-form" (submit)="onSubmit($event)">
            <div class="form-group">
                <label for="name">Họ và tên</label>
                <input type="text" id="name" placeholder="Nguyễn Văn A" class="zen-input">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@email.com" class="zen-input">
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" class="zen-input">
            </div>

            <div class="form-group">
                <label for="confirm-password">Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" placeholder="••••••••" class="zen-input">
            </div>

            <button type="submit" class="btn-auth">
                <span class="material-icons">person_add</span>
                ĐĂNG KÝ
            </button>
        </form>

        <div class="auth-footer">
            <p>Đã có tài khoản? <a routerLink="/login" class="text-gold">Đăng nhập</a></p>
        </div>
    </div>
</div>
