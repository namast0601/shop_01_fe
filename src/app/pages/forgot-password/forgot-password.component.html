<div class="auth-page">
    <!-- Decorative Background (Embers only) -->
    <div class="decor-background">
        <div class="embers">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="auth-container fade-in-up">
        <div class="auth-header">
            <h1 class="serif-italic text-gold">Quên Mật Khẩu</h1>
            <p class="sub-text">Nhập email của bạn để nhận liên kết đặt lại mật khẩu.</p>
        </div>

        <form class="auth-form" (submit)="onSubmit($event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@email.com" class="zen-input">
            </div>

            <button type="submit" class="btn-auth">
                <span class="material-icons">send</span>
                GỬI YÊU CẦU
            </button>
        </form>

        <div class="auth-footer">
            <p>Quay lại trang <a routerLink="/login" class="text-gold">Đăng nhập</a></p>
        </div>
    </div>
</div>
