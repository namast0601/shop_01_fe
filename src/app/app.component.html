<div class="grain-overlay"></div>

<div class="app-layout">
  <!-- Minimalist Zen Header -->
  <header class="zen-header" [class.scrolled]="isScrolled">
    <div class="container header-inner">
      <nav class="nav-left">
        <a routerLink="/" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Trang
          chủ</a>
        <a routerLink="/products" class="nav-link" routerLinkActive="active">Sản phẩm</a>
        <a routerLink="/about" class="nav-link" routerLinkActive="active">Giới thiệu</a>
      </nav>

      <a routerLink="/" class="logo serif-italic">
        <span class="logo-symbol">⚫</span>
        Tĩnh
      </a>

      <div class="nav-right">
        <a routerLink="/knowledge" class="nav-link" routerLinkActive="active">Kiến thức</a>
        <a routerLink="/contact" class="nav-link" routerLinkActive="active">Liên hệ</a>
        <button class="icon-btn">
          <span class="material-icons">search</span>
        </button>
        <a routerLink="/cart" class="icon-btn cart-btn-wrapper">
          <span class="material-icons">shopping_bag</span>
          @if (cartCount() > 0) {
          <span class="cart-badge">{{cartCount()}}</span>
          }
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <router-outlet />
  </main>

  <!-- Footer -->
  <footer class="zen-footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <h2 class="serif-italic">Tĩnh</h2>
          <p>Tinh hoa trầm hương - Tĩnh tại tâm hồn</p>
        </div>
        <div class="footer-links">
          <div class="col">
            <h3>Khám phá</h3>
            <a href="#">Trầm Hương</a>
            <a href="#">Kỳ Nam</a>
            <a href="#">Dụng Cụ</a>
          </div>
          <div class="col">
            <h3>Về Tĩnh</h3>
            <a href="#">Triết Lý</a>
            <a href="#">Nghệ Nhân</a>
            <a href="#">Liên Hệ</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Tĩnh Incense. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <app-toast />
</div>
